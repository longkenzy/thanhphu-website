<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191c23"/>
      <stop offset="50%" stop-color="#11151b"/>
      <stop offset="100%" stop-color="#080a0d"/>
    </linearGradient>
    <linearGradient id="glowGrad2" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#FFCB56" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <pattern id="heroGrid2" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Deep Architectural Background -->
  <rect width="1920" height="1080" fill="url(#heroGrad2)"/>
  <rect width="1920" height="1080" fill="url(#heroGrid2)"/>
  <rect width="1920" height="1080" fill="url(#glowGrad2)"/>

  <!-- Industrial Plant Silhouettes -->
  <g opacity="0.2">
    <!-- Factory Complex -->
    <polygon points="750,1080 750,650 950,520 1150,650 1150,1080" fill="#ffffff"/>
    <polygon points="1150,1080 1150,600 1380,480 1600,600 1600,1080" fill="#ffffff"/>
    <polygon points="1600,1080 1600,680 1780,560 1920,640 1920,1080" fill="#ffffff"/>
    <!-- Silos -->
    <rect x="620" y="580" width="90" height="500" rx="20" fill="#ffffff"/>
    <rect x="510" y="620" width="85" height="460" rx="18" fill="#ffffff"/>
  </g>

  <!-- Giant Pre-engineered Steel Structure Trusses -->
  <g opacity="0.45" stroke="#FFCB56" stroke-width="4" fill="none">
    <!-- Main Gable Frame 1 -->
    <polyline points="720,1080 820,380 1350,140 1880,380 1920,1080" stroke-width="8"/>
    <!-- Cross Bracing & Web Members -->
    <line x1="820" y1="380" x2="1880" y2="380" stroke-width="5" stroke-dasharray="16,8"/>
    <line x1="820" y1="380" x2="1085" y2="260"/>
    <line x1="1350" y1="140" x2="1085" y2="380"/>
    <line x1="1350" y1="140" x2="1615" y2="380"/>
    <line x1="1880" y1="380" x2="1615" y2="260"/>
    <!-- Internal Roof Purlins -->
    <line x1="950" y1="320" x2="950" y2="380" stroke-width="3"/>
    <line x1="1220" y1="200" x2="1220" y2="380" stroke-width="3"/>
    <line x1="1480" y1="200" x2="1480" y2="380" stroke-width="3"/>
    <line x1="1750" y1="320" x2="1750" y2="380" stroke-width="3"/>
  </g>

  <!-- Heavy Duty Crane Runway Girders & Overhead Crane -->
  <g opacity="0.5">
    <line x1="850" y1="460" x2="1920" y2="460" stroke="#ed1925" stroke-width="12"/>
    <!-- Overhead Traveling Crane Bridge -->
    <rect x="1300" y="430" width="220" height="40" fill="#FFCB56"/>
    <rect x="1390" y="470" width="40" height="30" fill="#ed1925"/>
    <line x1="1410" y1="500" x2="1410" y2="720" stroke="#ffffff" stroke-width="3" stroke-dasharray="8,6"/>
    <!-- Hoist Hook -->
    <path d="M 1400 720 L 1420 720 L 1410 750 Z" fill="#FFCB56"/>
  </g>

  <!-- Blueprint Laser Measurement Grid Lines -->
  <g opacity="0.3">
    <line x1="500" y1="1080" x2="1920" y2="100" stroke="#ed1925" stroke-width="1.5" stroke-dasharray="14,10"/>
    <circle cx="1350" cy="140" r="16" fill="none" stroke="#FFCB56" stroke-width="2"/>
    <circle cx="1350" cy="140" r="3" fill="#ed1925"/>
    <circle cx="820" cy="380" r="12" fill="none" stroke="#FFCB56" stroke-width="2"/>
    <circle cx="1880" cy="380" r="12" fill="none" stroke="#FFCB56" stroke-width="2"/>
  </g>

  <!-- Technical Coordinate Stamp -->
  <g opacity="0.35" transform="translate(1360, 960)">
    <text x="0" y="0" fill="#b3b2b7" font-family="'Montserrat', monospace" font-size="16" letter-spacing="4">INDUSTRIAL PARK PHASE IV • 48M CLEAR SPAN</text>
    <text x="0" y="24" fill="#FFCB56" font-family="'Montserrat', monospace" font-size="14" letter-spacing="2">STEEL GRADE Q345B • LASER SCREED SUPER FLAT FLOOR</text>
  </g>
</svg>